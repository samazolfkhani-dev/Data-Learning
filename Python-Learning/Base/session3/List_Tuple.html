<header class="hero"><div><h1>Python Lists and Tuples</h1><p>A complete guide: methods, slicing, copying, complexity and common traps.</p></div></header>
<main id="out"></main>
<script id="md" type="text/plain">
# PART 0 — INTRODUCTION
## 1. Introduction to Lists and Tuples
In Python, Lists and Tuples are built-in data structures used to store multiple values in a single variable. They let us organize, access, and manipulate collections of data.
~~~
# List
numbers = [10, 20, 30, 40]

# Tuple
coordinates = (10, 20, 30)
~~~
Both data structures:
- Can store multiple values.
- Preserve the order of elements.
- Support indexing and slicing.
- Allow duplicate values.
- Can store different data types and nested collections.

| Feature | List | Tuple |
| Syntax | [[ [] ]] | [[ () ]] |
| Mutable | Yes | No |
| Ordered | Yes | Yes |
| Duplicates | Allowed | Allowed |
| Indexing / Slicing | Supported | Supported |
| Methods | More methods | Fewer methods |
| Hashable | No | Sometimes |

! **The main difference:** a List is mutable — you can change its elements. A Tuple is immutable — you cannot change its elements after creation.

# PART 1 — LISTS
## 2. Creating Lists
~~~
numbers = [10, 20, 30, 40]
names = ["Ali", "Sara", "John"]
mixed = [10, "Python", 3.14, True]
empty = []

letters = list("Python")
print(letters)
# ['P', 'y', 't', 'h', 'o', 'n']

numbers = list(range(1, 6))
print(numbers)
# [1, 2, 3, 4, 5]
~~~
## 3. Indexing
Python uses zero-based indexing. Negative indexes count from the end — [[-1]] is always the last element.
~~~
fruits = ["Apple", "Banana", "Orange", "Mango"]

print(fruits[0])   # Apple
print(fruits[3])   # Mango
print(fruits[-1])  # Mango
print(fruits[-4])  # Apple

numbers = [10, 20, 30]
print(numbers[5])
# IndexError: list index out of range
~~~
## 4. Slicing
Syntax: [[list[start:stop:step]]] — [[start]] is included, [[stop]] is excluded.
~~~
numbers = [10, 20, 30, 40, 50, 60]

print(numbers[1:4])   # [20, 30, 40]
print(numbers[:3])    # [10, 20, 30]
print(numbers[2:])    # [30, 40, 50, 60]
print(numbers[::2])   # [10, 30, 50]
print(numbers[::-1])  # [60, 50, 40, 30, 20, 10]

numbers = [1, 2, 3, 4, 5, 6, 7, 8]
print(numbers[5:1:-1])  # [6, 5, 4, 3]
~~~
! **Important:** the stop index is never included.
## 5. Modifying Lists
~~~
numbers = [10, 20, 30]
numbers[1] = 99
print(numbers)  # [10, 99, 30]

numbers = [1, 2, 3, 4, 5]
numbers[1:3] = [20, 30]
print(numbers)  # [1, 20, 30, 4, 5]

# slice assignment can change the length
numbers = [1, 2, 3, 4, 5]
numbers[1:3] = [100, 200, 300]
print(numbers)  # [1, 100, 200, 300, 4, 5]
~~~
## 6. List Methods
### 6.1 append()
Adds its argument as a single element to the end.
~~~
numbers = [1, 2]
numbers.append([3, 4])
print(numbers)  # [1, 2, [3, 4]]
~~~
### 6.2 extend()
Adds elements of an iterable individually.
~~~
numbers = [1, 2]
numbers.extend([3, 4])
print(numbers)  # [1, 2, 3, 4]
~~~
- [[append()]] → one object.
- [[extend()]] → individual elements of an iterable.

### 6.3 insert()
~~~
numbers = [10, 20, 40]
numbers.insert(2, 30)   # list.insert(index, element)
print(numbers)  # [10, 20, 30, 40]
~~~
### 6.4 remove()
Removes the first occurrence of a value. Raises [[ValueError]] if the value does not exist.
~~~
numbers = [10, 20, 30, 20]
numbers.remove(20)
print(numbers)  # [10, 30, 20]
~~~
### 6.5 pop()
Removes and returns an element (last by default).
~~~
numbers = [10, 20, 30, 40]
print(numbers.pop())    # 40
print(numbers.pop(1))   # 20
print(numbers)          # [10, 30]
~~~
! **remove() vs pop():** [[remove(value)]] removes by value; [[pop(index)]] removes by index and returns the element.
### 6.6 clear(), index(), count()
~~~
numbers = [10, 20, 30, 20]
print(numbers.index(20))      # 1
print(numbers.index(20, 2))   # 3   (list.index(value, start, end))
print(numbers.count(20))      # 2
numbers.clear()
print(numbers)                # []
~~~
### 6.7 sort() and reverse()
~~~
numbers = [5, 2, 9, 1, 7]
numbers.sort()
print(numbers)   # [1, 2, 5, 7, 9]
numbers.sort(reverse=True)
print(numbers)   # [9, 7, 5, 2, 1]

words = ["apple", "Banana", "cherry"]
words.sort(key=str.lower)
print(words)     # ['apple', 'Banana', 'cherry']

words = ["python", "AI", "programming", "SQL"]
words.sort(key=len)
print(words)     # ['AI', 'SQL', 'python', 'programming']

numbers = [1, 2, 3, 4]
numbers.reverse()
print(numbers)   # [4, 3, 2, 1]
~~~
### 6.8 copy()
Creates a shallow copy.
~~~
a = [10, 20, 30]
b = a.copy()
b.append(40)
print(a)  # [10, 20, 30]
print(b)  # [10, 20, 30, 40]
~~~
## 7. List Operators
~~~
print([1, 2] + [3, 4])   # [1, 2, 3, 4]
print([1, 2] * 3)        # [1, 2, 1, 2, 1, 2]
print(20 in [10, 20])    # True
print(50 not in [10, 20])# True
print([1, 2] < [1, 3])   # True  (compared left to right)
~~~
## 8. Useful Built-in Functions
| Function | Purpose |
| len() | Number of elements |
| max() / min() | Maximum / minimum value |
| sum() | Sum of the elements |
| sorted() | Returns a new sorted list |
| any() / all() | At least one / every element is truthy |
| enumerate() | Index-value pairs |
| zip() | Combines corresponding elements |
| reversed() | Reverse iterator |

### sorted() vs sort()
~~~
numbers = [5, 2, 8, 1]
print(sorted(numbers))   # [1, 2, 5, 8]
print(numbers)           # [5, 2, 8, 1]  (unchanged)

result = numbers.sort()
print(result)            # None
~~~
! **Key difference:** [[sort()]] modifies the original list and returns [[None]]. [[sorted()]] returns a new sorted list.
## 9. Copying Lists: A Critical Concept
~~~
# Reference assignment: same object
a = [1, 2, 3]
b = a
b.append(4)
print(a)  # [1, 2, 3, 4]

# Shallow copy: nested lists are still shared
a = [[1, 2], [3, 4]]
b = a.copy()
b[0].append(99)
print(a)  # [[1, 2, 99], [3, 4]]

# Deep copy: fully independent
import copy
a = [[1, 2], [3, 4]]
b = copy.deepcopy(a)
b[0].append(99)
print(a)  # [[1, 2], [3, 4]]
~~~

# PART 2 — TUPLES
## 10. Introduction to Tuples
A tuple is an ordered, immutable collection of elements.
~~~
a = (1, 2, 3)
c = (10, "Hello", True)
numbers = tuple([1, 2, 3])
~~~
### Single-element tuple
~~~
x = (10)
print(type(x))   # <class 'int'>   NOT a tuple

x = (10,)
print(type(x))   # <class 'tuple'>
~~~
! The comma creates the tuple, not the parentheses.
## 11. Indexing and Slicing
~~~
colors = ("Red", "Green", "Blue", "Yellow")
print(colors[0])      # Red
print(colors[-1])     # Yellow
print(colors[1:3])    # ('Green', 'Blue')
print(colors[::-1])   # ('Yellow', 'Blue', 'Green', 'Red')
~~~
## 12. Tuple Immutability
~~~
numbers = (10, 20, 30)
numbers[1] = 99   # TypeError
~~~
Methods like [[append()]], [[remove()]] and [[pop()]] do not exist for tuples. But a mutable object *inside* a tuple can still change:
~~~
data = (10, [20, 30], 40)
data[1].append(50)
print(data)   # (10, [20, 30, 50], 40)
~~~
! Tuple immutability does not automatically make every nested object immutable.
## 13. Tuple Methods
Tuples have only two methods: [[count()]] and [[index()]].
~~~
numbers = (10, 20, 30, 20)
print(numbers.count(20))     # 2
print(numbers.index(20))     # 1
print(numbers.index(20, 2))  # 3
~~~
## 14. Packing and Unpacking
~~~
person = "Ali", 20, "Computer Engineering"   # packing
name, age, major = person                    # unpacking

numbers = (10, 20, 30, 40, 50)
first, *middle, last = numbers
print(middle)   # [20, 30, 40]  (a list, not a tuple)

a = 10
b = 20
a, b = b, a     # swap without a temp variable
print(a, b)     # 20 10
~~~
## 15. Hashability
A tuple is hashable only if all its elements are hashable, so it can be a dictionary key.
~~~
locations = {(35.7, 51.4): "Tehran", (40.7, -74.0): "New York"}
print(locations[(35.7, 51.4)])   # Tehran

data = (1, [2, 3])
# hash(data)  ->  TypeError: unhashable type: 'list'
~~~

# PART 3 — COMPARISON AND PERFORMANCE
## 16. List vs Tuple
| Concept | List | Tuple |
| Mutable | Yes | No |
| append / extend / insert | Yes | No |
| remove / pop / clear | Yes | No |
| sort / reverse | Yes | No |
| count / index | Yes | Yes |
| Indexing / Slicing / Unpacking | Yes | Yes |

**Use a list** when you need to add, remove or modify elements. **Use a tuple** for fixed records, returning multiple values from a function, or as a dictionary key.
## 17. Time Complexity of List Operations
| Operation | Average Time |
| Access / update by index | O(1) |
| append() | O(1) amortized |
| pop() from end | O(1) |
| pop(0) / insert(0, x) | O(n) |
| remove(x) / index(x) / count(x) | O(n) |
| Membership (in) | O(n) |
| sort() | O(n log n) |
| reverse() / copy | O(n) |

! **Tip:** if you frequently insert or remove at the beginning, consider [[collections.deque]].

# PART 4 — COMMON MISTAKES
## 18. Exam Traps
~~~
# 1. append() returns None
result = [1, 2, 3].append(4)
print(result)   # None

# 2. Slicing excludes the stop index
print([1, 2, 3, 4, 5][1:4])   # [2, 3, 4]

# 3. Assignment is not copying
a = [1, 2, 3]
b = a
b[0] = 99
print(a)   # [99, 2, 3]

# 4. Single-element tuple needs a comma
x = (5,)

# 5. Never modify a list while iterating over it; filter instead
numbers = [1, 2, 3, 4, 5]
numbers = [n for n in numbers if n % 2 != 0]
print(numbers)   # [1, 3, 5]
~~~

# PART 5 — QUICK REFERENCE
## 19. Cheat Sheet
| Method | Description |
| append(x) | Adds one element |
| extend(iterable) | Adds multiple elements |
| insert(i, x) | Inserts at index |
| remove(x) | Removes first matching value |
| pop(i) | Removes and returns element |
| clear() | Removes all elements |
| index(x) | Finds first matching index |
| count(x) | Counts occurrences |
| sort() | Sorts in place |
| reverse() | Reverses in place |
| copy() | Creates a shallow copy |

## Final Takeaways
- Lists are mutable; tuples are immutable.
- Tuples have only [[count()]] and [[index()]].
- [[append()]] adds one object; [[extend()]] adds elements from an iterable.
- [[remove()]] works by value; [[pop()]] works by index and returns the element.
- [[sort()]] modifies the list; [[sorted()]] returns a new one.
- [[a = b]] does not create a copy; [[copy()]] is shallow, [[deepcopy()]] is independent.
- Slicing uses [[start:stop:step]].

! The real goal is not memorizing every method. It is knowing which operation solves a problem correctly and efficiently.
</script>
<script>
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>esc(s).replace(/\[\[(.+?)\]\](?!\])/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const KW=/("[^"]*"|'[^']*')|\b(for|in|if|else|import|not|True|False|None|print)\b/g;
function hl(c){return esc(c).split('\n').map(l=>{const i=l.indexOf('#');let a=i<0?l:l.slice(0,i),b=i<0?'':'<span class="c">'+l.slice(i)+'</span>';return a.replace(KW,(m,s,k)=>s?'<span class="s">'+s+'</span>':'<span class="k">'+k+'</span>')+b}).join('\n')}
const L=document.getElementById('md').textContent.split('\n');
let h='',i=0,tup=false,open=false,ul=false;
const sec=()=>{if(open)h+='</section>';h+='<section>';open=true};
const endul=()=>{if(ul){h+='</ul>';ul=false}};
while(i<L.length){let l=L[i];
 if(l.startsWith('~~~')){endul();let c=[];i++;while(!L[i].startsWith('~~~')){c.push(L[i]);i++}
  h+='<pre'+(tup?' class="t"':'')+'><code>'+hl(c.join('\n'))+'</code></pre>'}
 else if(l.startsWith('# ')){endul();if(open){h+='</section>';open=false}tup=/TUPLES/.test(l);h+='<h1 class="part'+(tup?' t':/PART [0-9]/.test(l)&&!/PART 1/.test(l)?' x':'')+'">'+inl(l.slice(2))+'</h1>';sec()}
 else if(l.startsWith('### ')){endul();h+='<h3'+(tup?' class="t"':'')+'>'+inl(l.slice(4))+'</h3>'}
 else if(l.startsWith('## ')){endul();h+='<h2'+(tup?' class="t"':'')+'>'+inl(l.slice(3))+'</h2>'}
 else if(l.startsWith('|')){endul();let r=[];while(i<L.length&&L[i].startsWith('|')){r.push(L[i].split('|').slice(1,-1).map(x=>x.trim()));i++}i--;
  h+='<div class="tw"><table><thead><tr>'+r[0].map(x=>'<th>'+inl(x)+'</th>').join('')+'</tr></thead><tbody>'+r.slice(1).map(x=>'<tr>'+x.map(y=>'<td>'+inl(y)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
 else if(l.startsWith('- ')){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(l.slice(2))+'</li>'}
 else if(l.startsWith('! ')){endul();h+='<div class="note'+(tup?'':' good')+'">'+inl(l.slice(2))+'</div>'}
 else if(l.trim()){endul();h+='<p>'+inl(l)+'</p>'}
 else endul();
 i++}
endul();if(open)h+='</section>';
document.getElementById('out').innerHTML=h;
</script>
